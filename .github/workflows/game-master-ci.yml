name: game-master-ci

on:
  pull_request:
    paths: ["game-master/**", ".github/agents/**", ".github/prompts/**", ".github/instructions/**", ".github/workflows/game-master-ci.yml"]
  push:
    branches: [main]
    paths: ["game-master/**"]

permissions:
  contents: read

concurrency:
  group: game-master-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: game-master

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game-master/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:bdd
      - run: npm run test:arch
      - run: npm run factory:check

  infra-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: game-master/infra/github
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu fmt -check
      - run: tofu init -backend=false
      - run: tofu validate
