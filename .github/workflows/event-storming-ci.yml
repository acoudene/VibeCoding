name: event-storming-ci

on:
  pull_request:
    paths:
      - "event-storming/**"
      - ".github/agents/es-*"
      - ".github/prompts/es-*"
      - ".github/instructions/event-storming.instructions.md"
      - ".github/workflows/event-storming-ci.yml"
  push:
    branches: [main]
    paths: ["event-storming/**"]

permissions:
  contents: read

concurrency:
  group: event-storming-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: event-storming

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: event-storming/package-lock.json
      - run: npm ci
      # Même commande qu'en local : typecheck, unitaires, Durable Object et API sous Miniflare (`test:workers`),
      # BDD, règles d'architecture et cohérence des fichiers d'agents (`factory:check`).
      - name: Vérification complète
        run: npm run verify

  # Séparé de `verify` : Playwright et `wrangler dev` alourdissent la CI (plan 002, « Risques »).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: event-storming/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: npm run test:e2e
      # Mesure 300 post-its + 300 liens : les images par seconde sont journalisées, jamais bloquantes.
      - name: Mesure de performance (non bloquante)
        run: npm run test:e2e:perf
        continue-on-error: true
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            event-storming/playwright-report/
            event-storming/test-results/
          retention-days: 7
